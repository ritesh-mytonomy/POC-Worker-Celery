[pytest]
testpaths = tests
pythonpath = . ..
# /srv is read-only to the app user in the image
# NFR-7 coverage gate (task 13.2): the worker app and the engine. Partial runs, e.g. only tests/test_engine*, add --no-cov.
addopts = -p no:cacheprovider --cov=engine --cov=app --cov-report=term-missing --cov-fail-under=80
