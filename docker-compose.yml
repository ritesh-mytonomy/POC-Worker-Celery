name: clinsync-ingest-poc

x-app: &app
  build: .
  image: clinsync-ingest-poc:dev
  env_file:
    - path: .env
      required: false
  environment:
    # LocalStack accepts any credentials; these dummies let boto3 sign requests. Production uses an IAM role.
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    # Presigned URLs must name a host the browser can reach; the API itself uses AWS_ENDPOINT_URL.
    S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:4566}

x-worker: &worker
  <<: *app
  depends_on:
    redis:
      condition: service_healthy
    api:
      condition: service_healthy

services:
  localstack:
    image: localstack/localstack:2026.8.4
    environment:
      SERVICES: s3
      # Check SigV4 signatures, as real S3 does — otherwise a presigned URL for the wrong host would still work.
      S3_SKIP_SIGNATURE_VALIDATION: "0"
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./infra/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      # Healthy only once the ready.d hook has created the bucket.
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinsync}
      POSTGRES_USER: ${POSTGRES_USER:-clinsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinsync}
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # then clinsync_test from the same schema: the test suite's own database, never the stack's
      - ./infra/postgres/test_db.sh:/docker-entrypoint-initdb.d/test_db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    command: ["uvicorn", "poc.main:app", "--host", "0.0.0.0", "--port", "8000"]   # POC wrapper: app.main:app + /poc/*
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker-ingest:
    <<: *worker
    command: celery -A workers.tasks worker -Q clinsync.ingest -c ${INGEST_CONCURRENCY:-2} -n ingest@%h

  worker-scan:
    <<: *worker
    command: celery -A poc.worker worker -Q clinsync.scan -c 1 -n scan@%h   # POC wrapper: workers.tasks + scan stub

  worker-maint:
    <<: *worker
    command: celery -A workers.tasks worker -Q clinsync.maintenance -c 1 -B -n maint@%h

  # The browser client (Anugrah's React app, ported — upload-ingest-merge Phase 6), served by Vite.
  client:
    build: ./client
    image: clinsync-ingest-poc-client:dev
    environment:
      # Read by the BROWSER, so it is the host's address for the API (published on 127.0.0.1:8000),
      # not the compose service name. Anugrah's variable name, kept (design.md §7).
      VITE_SCAN_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null"]   # IPv4: Vite listens on 0.0.0.0
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  redis-data:
